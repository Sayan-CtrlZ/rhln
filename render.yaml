services:
  - type: web
    name: rhln-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_AS_OF
        value: 2026-10-01
      - key: ANTHROPIC_API_KEY
        sync: false
